<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: white;">
  <!-- 标题 -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="black">就业管理系统架构图</text>
  
  <!-- 前端层 -->
  <rect x="50" y="80" width="200" height="100" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">前端应用层</text>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Vue3 + Element Plus</text>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">学生端 | 教师端</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">企业端 | 管理端</text>
  
  <!-- 微信小程序 -->
  <rect x="50" y="200" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">微信小程序</text>
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Taro/Uni-app</text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">学生移动端应用</text>
  
  <!-- API网关/接口层 -->
  <rect x="50" y="310" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="150" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">API接口层</text>
  <text x="150" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">RESTful API</text>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">JWT认证 | 权限控制</text>
  
  <!-- 后端服务层 -->
  <rect x="300" y="80" width="200" height="140" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">后端服务层</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Spring Boot</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">用户管理 | 企业管理</text>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">简历管理 | 职位管理</text>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">数据分析 | 智能匹配</text>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">消息通知 | 导出报表</text>
  
  <!-- 业务模块 -->
  <rect x="300" y="240" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">业务模块</text>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Controller → Service</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">DTO | Entity | Mapper</text>
  
  <!-- 数据访问层 -->
  <rect x="300" y="340" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">数据访问层</text>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">MyBatis Plus</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">ORM映射 | 数据查询</text>
  
  <!-- 数据库层 -->
  <rect x="550" y="80" width="200" height="100" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="650" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">数据库层</text>
  <text x="650" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">MySQL</text>
  <text x="650" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">用户表 | 企业表</text>
  <text x="650" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">简历表 | 职位表</text>
  
  <!-- AI服务 -->
  <rect x="550" y="200" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="650" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">AI智能服务</text>
  <text x="650" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Coze + DeepSeek</text>
  <text x="650" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">简历解析 | 智能匹配</text>
  
  <!-- 微信公众号服务 -->
  <rect x="550" y="310" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="650" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">微信公众号</text>
  <text x="650" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">消息推送</text>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">教师绑定 | 通知提醒</text>
  
  <!-- 第三方服务 -->
  <rect x="550" y="410" width="200" height="80" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="650" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">外部服务</text>
  <text x="650" y="460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">验证码 | 文件存储</text>
  <text x="650" y="480" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">数据导出 | 监控告警</text>
  
  <!-- 连接箭头 -->
  <!-- 前端到API -->
  <line x1="250" y1="130" x2="250" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="240" x2="250" y2="350" stroke="black" stroke-width="2"/>
  
  <!-- 小程序到API -->
  <line x1="250" y1="240" x2="250" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API到后端 -->
  <line x1="250" y1="350" x2="300" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 后端到数据访问 -->
  <line x1="400" y1="220" x2="400" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 数据访问到数据库 -->
  <line x1="500" y1="380" x2="550" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 后端到AI -->
  <line x1="500" y1="150" x2="550" y2="240" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 后端到微信公众号 -->
  <line x1="500" y1="170" x2="550" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 后端到外部服务 -->
  <line x1="500" y1="190" x2="550" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black" />
    </marker>
  </defs>
  
  <!-- 技术栈说明 -->
  <text x="50" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="black">核心技术栈:</text>
  <text x="50" y="560" font-family="Arial, sans-serif" font-size="12" fill="black">前端: Vue3 + Vite + Element Plus | 后端: Spring Boot + MyBatis Plus | 数据库: MySQL | AI: Coze/DeepSeek</text>
</svg>