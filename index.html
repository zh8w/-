<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f2f8" />
    <meta name="description" content="吴炜涵 · 个人作品集" />
    <title>吴炜涵 · 作品集</title>

    <!--
      主题预置脚本（关键：必须在 CSS / Vue 之前执行）
      作用：在首帧渲染前把主题写进 <html data-theme>，
            避免「先深后亮」的闪烁。默认亮色。
      规则：localStorage 有记录就尊重用户选择，没有则用 light。
      【TODO】如需默认跟随系统，把 fallback 的 'light' 换成 matchMedia 判断即可。
    -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var saved = window.localStorage.getItem('portfolio-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (error) {
          /* 隐私模式下读不到，保持默认亮色 */
        }
        document.documentElement.setAttribute('data-theme', theme)
        // 同步地址栏配色，避免首帧还是深色
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#07080d' : '#f1f2f8')
      })()

      // 入场动效开关：只有「支持观察者 + 用户没要求减少动画」时才允许 CSS 先隐藏元素，
      // 否则元素保持默认可见（宁可没有动画，也不能白屏）。
      ;(function () {
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (!reduce && 'IntersectionObserver' in window) {
            document.documentElement.setAttribute('data-motion', 'on')
          }
        } catch (error) {
          /* 忽略：动画不生效，页面照常可见 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
